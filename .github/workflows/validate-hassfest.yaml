name: Validate Hassfest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-hassfest:
    name: Hassfest validation
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v5"
      - name: Hassfest validation
        uses: "home-assistant/actions/hassfest@master"
