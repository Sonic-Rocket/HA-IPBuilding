rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  # The coordinator polls every 20 s only when at least one
  # POLLED_DEVICE_TYPES device is present at startup. Installations
  # that only have buttons, sensors or scenes disable the interval and
  # rely on write-triggered refreshes (see `coordinator.py`).
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done
